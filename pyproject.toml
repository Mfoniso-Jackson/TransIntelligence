[project]
name = "transintelligence"
version = "0.1.0"
description = "Domain-agnostic intelligence kernel primitives."
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
